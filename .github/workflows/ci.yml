name: Leakproof CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Gate cohort quality and injection resistance
        run: >-
          uv run python scripts/run_evals.py
          --no-persist
          --report /tmp/leakproof-eval-report.json
