name: leakproof

x-app: &app
  image: leakproof-app:latest
  env_file:
    - path: .env
      required: false
  environment:
    LEAKPROOF_DATABASE_URL: postgresql+psycopg://leakproof:leakproof@postgres:5432/leakproof
    LEAKPROOF_REDIS_URL: redis://redis:6379/0
  volumes:
    - ./config:/app/config:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: leakproof
      POSTGRES_USER: leakproof
      POSTGRES_PASSWORD: leakproof
    ports:
      - "55432:5432"
    volumes:
      - leakproof-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leakproof -d leakproof"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    build:
      context: .
    command: ["uvicorn", "leakproof.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["celery", "-A", "leakproof.celery_app:celery", "worker", "--loglevel=INFO"]

  beat:
    <<: *app
    command: ["celery", "-A", "leakproof.celery_app:celery", "beat", "--loglevel=INFO"]

volumes:
  leakproof-postgres:
